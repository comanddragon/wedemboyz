{% extends "emails/base.html" %}
{% block content %}
<p style="font-size:16px;line-height:1.8;margin:0 0 20px;">{{ intro }}</p>
{% if body %}<div style="font-size:15px;line-height:1.8;margin:0 0 24px;white-space:pre-line;">{{ body }}</div>{% endif %}
{% if details %}<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:14px;">{% for label, value in details %}<tr><th scope="row" align="left" style="padding:12px 10px;border-bottom:1px solid #e5e7eb;color:#667085;-webkit-text-fill-color:#667085;font-weight:normal;vertical-align:top;">{{ label }}</th><td align="right" style="padding:12px 10px;border-bottom:1px solid #e5e7eb;white-space:pre-line;">{{ value }}</td></tr>{% endfor %}</table>{% endif %}
{% endblock %}
